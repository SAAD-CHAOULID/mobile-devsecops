services:
  service_ssl:
    build: .
    container_name: service_ssl
    ports:
      - "8009:8009"
    volumes:
      - apk_storage:/apk_storage
      - .:/app
    env_file: .env
    networks:
      - pipeline_net
    restart: unless-stopped
volumes:
  apk_storage:
    external: true
networks:
  pipeline_net:
    external: true
