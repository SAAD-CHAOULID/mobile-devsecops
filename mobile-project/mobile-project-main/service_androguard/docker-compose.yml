services:
  service_androguard:
    build: .
    container_name: service_androguard
    ports:
      - "8004:8004"
    volumes:
      - apk_storage:/apk_storage
      - .:/app
    env_file: .env
    networks:
      - pipeline_net
    restart: unless-stopped
volumes:
  apk_storage:
    external: true
networks:
  pipeline_net:
    external: true
