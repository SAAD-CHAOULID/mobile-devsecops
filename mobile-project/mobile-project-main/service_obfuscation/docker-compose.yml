services:
  service_obfuscation:
    build: .
    container_name: service_obfuscation
    ports:
      - "8008:8008"
    volumes:
      - apk_storage:/apk_storage
      - .:/app
    env_file: .env
    networks:
      - pipeline_net
    restart: unless-stopped
volumes:
  apk_storage:
    external: true
networks:
  pipeline_net:
    external: true
