services:
  service_aggregator:
    build: .
    container_name: service_aggregator
    ports:
      - "8011:8011"
    volumes:
      - .:/app
      - reports_storage:/reports
    env_file: .env
    networks:
      - pipeline_net
    restart: unless-stopped

volumes:
  reports_storage:
    external: true

networks:
  pipeline_net:
    external: true
