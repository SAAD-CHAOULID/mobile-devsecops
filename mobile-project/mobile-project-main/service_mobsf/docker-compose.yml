services:
  service_mobsf:
    build: .
    container_name: service_mobsf
    ports:
      - "8001:8001"
    volumes:
      - apk_storage:/apk_storage
      - .:/app
    env_file: .env
    networks:
      - pipeline_net
    restart: unless-stopped
volumes:
  apk_storage:
    external: true
networks:
  pipeline_net:
    external: true
