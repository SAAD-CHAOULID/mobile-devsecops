services:
  service_gitleaks:
    build: .
    container_name: service_gitleaks
    ports:
      - "8002:8002"
    volumes:
      - repos_storage:/repos_storage
      - .:/app
    env_file: .env
    networks:
      - pipeline_net
    restart: unless-stopped
volumes:
  repos_storage:
    external: true
networks:
  pipeline_net:
    external: true
