services:
  service_virustotal:
    build: .
    container_name: service_virustotal
    ports:
      - "8005:8005"
    volumes:
      - apk_storage:/apk_storage
      - .:/app
    env_file: .env
    networks:
      - pipeline_net
    restart: unless-stopped
volumes:
  apk_storage:
    external: true
networks:
  pipeline_net:
    external: true
