services:
  service_permissions:
    build: .
    container_name: service_permissions
    ports:
      - "8006:8006"
    volumes:
      - apk_storage:/apk_storage
      - .:/app
    env_file: .env
    networks:
      - pipeline_net
    restart: unless-stopped
volumes:
  apk_storage:
    external: true
networks:
  pipeline_net:
    external: true
